[project]
name = "wp-generator"
version = "0.1.0"
description = "Statistical procedural wallpaper generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "noise>=1.2.2",
  "numpy>=2.0",
  "pillow>=11.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
macos = [
  "mss>=10.0",
  "pyobjc-core>=11.0",
  "pyobjc-framework-quartz>=11.0",
]

[dependency-groups]
dev = []
